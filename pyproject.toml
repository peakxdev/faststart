[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "faststart"
version = "0.1.0"
description = "Find and fix MP4/MOV files that start slowly on the web (moov atom at the end). Lossless."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Peak Software" }]
keywords = ["mp4", "faststart", "moov", "video", "streaming", "ffmpeg"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Topic :: Multimedia :: Video"]

[project.urls]
Homepage = "https://github.com/peakxdev/faststart"

[project.scripts]
faststart = "faststart.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
